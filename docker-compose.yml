version: '3.8'

services:
  # React frontend with hot reloading
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8080/api
    networks:
      - mcshop-network

  # Production build with Nginx
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - mcshop-network

networks:
  mcshop-network:
    driver: bridge 