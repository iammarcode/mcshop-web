version: '3.8'

services:
  # React frontend with hot reloading
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - mcshop-network

  # Backend API service (placeholder)
  backend:
    image: node:18-alpine
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "npm install && npm start"
    environment:
      - NODE_ENV=development
    networks:
      - mcshop-network

  # Production build with Nginx
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mcshop-network

networks:
  mcshop-network:
    driver: bridge 